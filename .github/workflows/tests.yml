name: NOBAD File Bridge tests

# Runs the NOBAD File Bridge unit tests on every push to main and every pull request (check: file-bridge-tests).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-bridge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: file-bridge-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libnss3 libasound2t64

      # Exactly the versions in uv.lock (fails if the lock is out of date with pyproject.toml), so CI tests what ships.
      - name: Install the app and test dependencies from uv.lock
        run: uv sync --locked --extra dev

      - name: Unit tests
        run: uv run --no-sync python -m pytest -q tests
