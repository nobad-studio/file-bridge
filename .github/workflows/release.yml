name: NOBAD File Bridge release

# Builds NOBAD File Bridge from a version tag on clean GitHub-hosted runners (Windows: the PyInstaller app as a zip;
# Linux: the .deb) and publishes a GitHub Release with both, their SHA-256 files and a signed build-provenance
# attestation. Same shape as NOBAD VPN's release workflow.
#   Release:  git tag v0.5.0 && git push origin v0.5.0      (the tag must match app/__init__.py and CHANGELOG.md)
#   Dry run:  Actions -> "NOBAD File Bridge release" -> Run workflow (builds and keeps the artifacts, no release).
#             Pull requests that change packaging run the builds too.
#   Verify a download:  gh attestation verify <file> -R nobad-studio/file-bridge --signer-workflow nobad-studio/file-bridge/.github/workflows/release.yml --source-ref refs/tags/v<version> --deny-self-hosted-runners
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "build.spec", "packaging/**", "pyproject.toml", "uv.lock"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read and check the version
        id: ver
        env:
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          ver=$(python3 -c 'import re,pathlib;print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("app/__init__.py").read_text()).group(1))')
          proj=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          top=$(grep -m1 -oP '^## \K\d+\.\d+\.\d+' CHANGELOG.md)
          [ "$ver" = "$proj" ] || { echo "app/__init__.py says $ver, pyproject.toml says $proj"; exit 1; }
          [ "$ver" = "$top" ] || { echo "CHANGELOG.md's newest entry is $top, not $ver"; exit 1; }
          if [[ "$REF" == refs/tags/v* ]] && [ "v$ver" != "$TAG" ]; then echo "Tag $TAG does not match $ver"; exit 1; fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install from uv.lock and run the tests
        run: |
          uv sync --locked --extra dev
          uv run --no-sync python -m pytest -q tests
      - name: Build the app (PyInstaller, pinned)
        run: uv run --no-sync --with pyinstaller==6.22.3 pyinstaller --clean --noconfirm build.spec
      - name: Check the built app (UI files, API, Monaco; no window on the runner)
        run: |
          $p = Start-Process -FilePath dist\NobadFileBridge\NobadFileBridge.exe -ArgumentList "--self-check" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "The packaged app failed its self-check (exit $($p.ExitCode))" }
      - name: Zip and checksum
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $zip = "out\NobadFileBridge-$env:VER-windows-x64.zip"
          Compress-Archive -Path dist\NobadFileBridge -DestinationPath $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$h  $(Split-Path $zip -Leaf)" | Out-File -Encoding ascii "$zip.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nobad-file-bridge-windows
          path: out/*
          retention-days: 30
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-22.04          # the oldest supported Ubuntu, so the bundle runs on 22.04 and newer
    timeout-minutes: 45
    env:
      VER: ${{ needs.version.outputs.version }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libnss3 libasound2
      - name: Install from uv.lock and run the tests
        run: |
          uv sync --locked --extra dev
          uv run --no-sync python -m pytest -q tests
      - name: Build the app (PyInstaller, pinned) and the .deb
        run: |
          uv run --no-sync --with pyinstaller==6.22.3 pyinstaller --clean --noconfirm build.spec
          bash packaging/linux/build-deb.sh "$VER" amd64
      - name: Check the built app (UI files, API, Monaco; no window on the runner)
        run: dist/NobadFileBridge/NobadFileBridge --self-check
      - name: Checksum
        run: |
          mkdir -p out && cp dist/nobad-file-bridge_"$VER"_amd64.deb out/
          (cd out && sha256sum nobad-file-bridge_"$VER"_amd64.deb > nobad-file-bridge_"$VER"_amd64.deb.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nobad-file-bridge-linux
          path: out/*
          retention-days: 30
          if-no-files-found: error

  publish:
    # Only this job can write to the repository, and it runs no build code: it attests and publishes the files the
    # build jobs produced.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # create the GitHub Release
      id-token: write        # sign the provenance attestation (Sigstore)
      attestations: write    # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nobad-file-bridge-*
          merge-multiple: true
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.deb
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 -c "import re,sys;s=open('CHANGELOG.md',encoding='utf-8').read();m=re.search(r'^## ' + re.escape(sys.argv[1]) + r'\b.*?(?=^## |\Z)', s, re.S|re.M);open('notes.md','w',encoding='utf-8').write(m.group(0) if m else 'See CHANGELOG.md')" "$VER"
          gh release create "$TAG" dist/* -R "${{ github.repository }}" --title "NOBAD File Bridge $VER" --notes-file notes.md --verify-tag
          {
            echo "### NOBAD File Bridge $VER published"
            echo "SHA-256:"
            echo '```'
            cat dist/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
